applicationId=com.dangerfield.movingeyes
# The line below is rewritten by release-please when a release PR merges. The
# annotation is what tells it which line to touch: listing this file under
# extra-files is not enough on its own, and without the annotation it changes
# nothing and says nothing, which is how the tag and the shipped versionName
# came to disagree.
#
# The annotation stays on its own line rather than trailing the value.
# Properties.load reads a trailing "# ..." as part of the value, so the inline
# form would set versionName to "1.0.0 # x-release-please-version".
# x-release-please-version
versionName=0.1.0
versionCode=1
releaseChannel=dev
buildNumber=1
