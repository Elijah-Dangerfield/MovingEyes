# detekt config for the project's custom ruleset.
#
# detekt's built-in rule sets are turned off in build.gradle.kts
# (disableDefaultRuleSets = true) — this file only configures the custom
# `movingeyes` rules from :detekt-rules. Adding a rule = a new entry here plus
# a constructor reference in MovingEyesRuleSetProvider.
movingeyes:
  active: true
  VerifyStrings:
    active: true
    # Developer-facing surfaces that never ship to a user: the design-system
    # catalog (spec copy) and the QA menu (both debug-build only, reachable
    # solely by shaking the device). Their labels are plain constants.
    excludes: [
      '**/libraries/ui/src/commonMain/kotlin/**/catalog/**',
      '**/apps/compose/src/commonMain/kotlin/**/QaConfig*.kt',
      '**/apps/compose/src/commonMain/kotlin/**/EyeGalleryScreen.kt',
    ]
